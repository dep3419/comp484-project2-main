<!DOCTYPE html>
<html>

<head>
    <title>Morris the Giga Pet</title>

    <meta charset="utf-8">

    <link rel="stylesheet" href="style.css">

    <script src="https://code.jquery.com/jquery-2.2.1.min.js"></script>
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>🌸 Morris's Giga Pet Paradise 🌸</h1>
    </header>

    <main>

        <section class="pet-image-container">
            <!-- Speech Bubble -->
            <div class="pet-message">
                Hi! I'm Morris!
            </div>

            <img
                class="pet-image"
                src="images/opossum.png"
                alt="Morris the Opossum">

        </section>

        <section class="dashboard">

            <div>
                Name:
                <strong><span class="name"></span></strong>
            </div>

            <div>
                Weight:
                <strong><span class="weight"></span> pounds</strong>
            </div>

            <div>
                Happiness:
                <strong><span class="happiness"></span> tail wags/min</strong>
            </div>

            <div>
                Energy:
                <strong><span class="energy"></span></strong>
            </div>

            <div>
                Mood:
                <strong><span class="mood"></span></strong>
            </div>

            <div class="button-container">

                <button class="treat-button">
                    Treat
                </button>

                <button class="play-button">
                    Play
                </button>

                <button class="exercise-button">
                    Exercise
                </button>

                <button class="sleep-button">
                    Sleep
                </button>

            </div>

            <div class="effects-container"></div>

        </section>

    </main>
</body>

</html>
